version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      dev-tooling:
        dependency-type: development
      runtime:
        dependency-type: production
    ignore:
      # Must match engines.vscode; raise both together, on purpose.
      - dependency-name: '@types/vscode'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
