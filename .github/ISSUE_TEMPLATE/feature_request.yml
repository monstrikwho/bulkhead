name: Feature request
description: Suggest an improvement or a new database type.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: How do other tools handle it?
      description: TablePlus, DataGrip, DBeaver, … Screenshots welcome.
